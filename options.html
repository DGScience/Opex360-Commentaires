<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importer la configuration Opex360</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon-48.png" width="48" height="48" alt="">
      <div>
        <h1>Importer la configuration Opex360</h1>
        <p>Cette page reste ouverte pendant le choix du fichier.</p>
      </div>
    </header>
    <section class="card">
      <p>Sélectionnez le fichier JSON précédemment créé avec le bouton <strong>Exporter</strong>.</p>
      <p>L’import remplacera les auteurs, couleurs et options actuellement enregistrés dans cette version de l’extension.</p>
      <button id="choose-file" type="button">Choisir le fichier JSON</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
